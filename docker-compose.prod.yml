services:
  genesis-db:
    image: mongo:6.0
    container_name: genesis-db
    restart: unless-stopped
    volumes:
      - genesis_data:/data/db
    networks: [genesis-net]
    # Replica set de 1 nó: necessário para TRANSAÇÕES (movimentações de estoque — G2).
    # O healthcheck inicia o replica set na primeira vez e depois só confere o status.
    command: ["--replSet", "rs0", "--bind_ip_all"]
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --eval "try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'genesis-db:27017'}]}).ok }"
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s

  genesis-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: genesis-backend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - MONGO_URI=mongodb://genesis-db:27017/genesis?replicaSet=rs0
      - JWT_SECRET=${JWT_SECRET:?defina JWT_SECRET no .env}
      - CORS_ORIGIN=${CORS_ORIGIN:-*}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-administrador@admin.com.br}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}
    depends_on:
      genesis-db:
        condition: service_healthy
    networks: [genesis-net]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 15s

  genesis-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: genesis-frontend
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      genesis-backend:
        condition: service_healthy
    networks: [genesis-net]

networks:
  genesis-net:
    driver: bridge

volumes:
  genesis_data:
