# Ambiente de DESENVOLVIMENTO (hot-reload, portas expostas).
# Produção: use docker-compose.prod.yml
services:
  genesis-db:
    image: mongo:6.0
    container_name: genesis-db
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - genesis_data:/data/db
    networks:
      - genesis-net

  genesis-backend:
    build: ./backend
    container_name: genesis-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - MONGO_URI=mongodb://genesis-db:27017/genesis
      - JWT_SECRET=super_secret_genesis_key_2026
    depends_on:
      - genesis-db
    networks:
      - genesis-net
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 20s

  genesis-frontend:
    build: ./frontend
    container_name: genesis-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_PORT=5173
    depends_on:
      - genesis-backend
    networks:
      - genesis-net

networks:
  genesis-net:
    driver: bridge

volumes:
  genesis_data:
